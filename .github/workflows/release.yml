# タグ (v*) を push すると pico2_geek_sim をビルドして GitHub Release を作る
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Firmware
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gen_version.py がコミット数を数えるため全履歴が必要

      # タグと version.h の FW_VERSION がずれていたら止める
      - name: Check tag matches FW_VERSION
        run: |
          fw=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' version.h)
          if [ "v$fw" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match FW_VERSION $fw"
            exit 1
          fi
          echo "FW_VERSION=$fw" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('Firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build pico2_geek_sim
        run: pio run -e pico2_geek_sim

      # CHANGELOG.md の該当バージョンの節をリリースノートにする
      - name: Extract release notes
        run: |
          awk -v v="$FW_VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || echo "See CHANGELOG.md" > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".pio/build/pico2_geek_sim/sticksat-pico2_geek_sim-v$FW_VERSION.uf2" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
