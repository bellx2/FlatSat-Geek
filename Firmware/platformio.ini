; Adjusted for this repo's flat layout: source files sit directly in this
; folder (unlike the internal tree this was extracted from, which nested
; them under New-firmware/).
[platformio]
src_dir = .

[env:pico_tinyusb]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags = -DUSE_TINYUSB
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    makuna/NeoPixelBus @ ^2.8.0
    sparkfun/SparkFun LIS2DH12 Arduino Library @ ^1.0.3
    adafruit/Adafruit BME280 Library @ ^2.2.4

; The course build. Same source, one flag: both SX1262 are held in reset and
; every call that would drive them is compiled out. The board cannot transmit
; or receive on any band, which is a property somebody can verify rather than
; a promise somebody has to trust.
;
;   pio run -e pico_tinyusb_norf
;
[env:pico_tinyusb_norf]
extends = env:pico_tinyusb
build_flags = -DUSE_TINYUSB -DFLATSAT_NO_RADIO=1

; Raspberry Pi Pico 2 (RP2350). The upstream UF2 is RP2040-only (family id
; 0xe48bff56); RP2350 needs its own build (family id 0xe48bff59).
;   pio run -e pico2_tinyusb
[env:pico2_tinyusb]
extends = env:pico_tinyusb
board = rpipico2

; RP2350 (Pico 2) variant of the course build:
;   pio run -e pico2_tinyusb_norf
[env:pico2_tinyusb_norf]
extends = env:pico_tinyusb_norf
board = rpipico2

; Waveshare RP2350-GEEK: no radio hardware, status screen on the 1.14" LCD.
;   pio run -e pico2_geek_norf
[env:pico2_geek_norf]
extends = env:pico2_tinyusb_norf
build_flags = -DUSE_TINYUSB -DFLATSAT_NO_RADIO=1 -DFLATSAT_LCD_GEEK=1
extra_scripts = pre:tools/gen_version.py
lib_deps =
    ${env:pico_tinyusb.lib_deps}
    adafruit/Adafruit GFX Library @ ^1.11.9

; Same as pico2_geek_norf, plus simulated BME280 / LIS2DH12 / GPS values, for a
; board with no sensors attached. A real GPS that sends NMEA still wins.
; Simulated GPS = a satellite on an ISS-like orbit (-DFLATSAT_SIM_ORBIT_SPEEDUP=60
; runs it 60x faster). -DFLATSAT_SIM_GPS_MODE=1 keeps it inside the ground-station
; radius instead, =2 keeps it outside.
;   pio run -e pico2_geek_sim
[env:pico2_geek_sim]
extends = env:pico2_geek_norf
build_flags = -DUSE_TINYUSB -DFLATSAT_NO_RADIO=1 -DFLATSAT_LCD_GEEK=1 -DFLATSAT_SIM_SENSORS=1
